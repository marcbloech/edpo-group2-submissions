# Adapted from Lab 4: runner/docker-compose/docker-compose-kafka-java-choreography.yml
# Extended with Camunda 8 (Zeebe) infrastructure for BPMN orchestration (E3/E4)
#
# Start everything:  docker compose up --build
# Stop everything:   docker compose down
# View logs:         docker compose logs -f process
services:

  # --- Kafka cluster (3 brokers + 1 dedicated KRaft controller) ---
  # Uses KRaft mode (no separate ZooKeeper needed — Kafka manages itself).
  # Three brokers with replication factor 3 for fault tolerance:
  # if one broker dies, Kafka promotes a replica and services resume.

  # Dedicated KRaft controller — manages cluster metadata only, no data.
  controller:
    image: confluentinc/cp-kafka:7.5.3
    hostname: controller
    networks:
      - worldpulse
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller:9093

  kafka1:
    image: confluentinc/cp-kafka:7.5.3
    hostname: kafka1
    networks:
      - worldpulse
    ports:
      - "9092:9092"                           # host access for debugging (localhost:9092)
    environment:
      KAFKA_NODE_ID: 2
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    depends_on:
      - controller

  kafka2:
    image: confluentinc/cp-kafka:7.5.3
    hostname: kafka2
    networks:
      - worldpulse
    ports:
      - "9094:9094"                           # host access for debugging (localhost:9094)
    environment:
      KAFKA_NODE_ID: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: INTERNAL://:29094,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29094,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    depends_on:
      - controller

  kafka3:
    image: confluentinc/cp-kafka:7.5.3
    hostname: kafka3
    networks:
      - worldpulse
    ports:
      - "9096:9096"                           # host access for debugging (localhost:9096)
    environment:
      KAFKA_NODE_ID: 4
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: INTERNAL://:29096,EXTERNAL://:9096
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:29096,EXTERNAL://localhost:9096
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    depends_on:
      - controller

  # --- Signup service (entry point) ---
  # Exposes POST /api/signup → publishes SignupRequestedEvent to Kafka
  signup:
    build:
      context: ./signup
      dockerfile: Dockerfile
    networks:
      - worldpulse
    ports:
      - "8091:8091"                           # access via http://localhost:8091/api/signup
    depends_on:
      - kafka1
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka1:29092,kafka2:29094,kafka3:29096
      - CAMUNDA_CLIENT_MODE=${CAMUNDA_CLIENT_MODE:-selfManaged}
      - CAMUNDA_CLUSTER_ID=${CAMUNDA_CLUSTER_ID:-}
      - CAMUNDA_CLUSTER_REGION=${CAMUNDA_CLUSTER_REGION:-}
      - CAMUNDA_CLOUD_BASE_URL=${CAMUNDA_CLOUD_BASE_URL:-}
      - CAMUNDA_CLIENT_ID=${CAMUNDA_CLIENT_ID:-}
      - CAMUNDA_CLIENT_SECRET=${CAMUNDA_CLIENT_SECRET:-}
      - CAMUNDA_OAUTH_URL=${CAMUNDA_OAUTH_URL:-}
      - ZEEBE_GRPC_ADDRESS=${ZEEBE_GRPC_ADDRESS:-http://zeebe:26500}

  # --- Payment service (reacts to signups) ---
  # Listens for SignupRequestedEvent → processes payment → publishes PaymentReceived/FailedEvent
  payment:
    build:
      context: ./payment
      dockerfile: Dockerfile
    networks:
      - worldpulse
    ports:
      - "8093:8093"
    depends_on:
      - kafka1
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka1:29092,kafka2:29094,kafka3:29096
      - CAMUNDA_CLIENT_MODE=${CAMUNDA_CLIENT_MODE:-selfManaged}
      - CAMUNDA_CLUSTER_ID=${CAMUNDA_CLUSTER_ID:-}
      - CAMUNDA_CLUSTER_REGION=${CAMUNDA_CLUSTER_REGION:-}
      - CAMUNDA_CLOUD_BASE_URL=${CAMUNDA_CLOUD_BASE_URL:-}
      - CAMUNDA_CLIENT_ID=${CAMUNDA_CLIENT_ID:-}
      - CAMUNDA_CLIENT_SECRET=${CAMUNDA_CLIENT_SECRET:-}
      - CAMUNDA_OAUTH_URL=${CAMUNDA_OAUTH_URL:-}
      - ZEEBE_GRPC_ADDRESS=${ZEEBE_GRPC_ADDRESS:-http://zeebe:26500}

  # --- Notification service (Exercise 2: Event Notification pattern) ---
  # Listens to ALL events on the "worldpulse" topic and logs simulated emails.
  # This is the core of the exercise — a pure consumer implementing Event Notification.
  notification:
    build:
      context: ./notification
      dockerfile: Dockerfile
    networks:
      - worldpulse
    ports:
      - "8094:8094"
    depends_on:
      - kafka1
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka1:29092,kafka2:29094,kafka3:29096
      - CAMUNDA_CLIENT_MODE=${CAMUNDA_CLIENT_MODE:-selfManaged}
      - CAMUNDA_CLUSTER_ID=${CAMUNDA_CLUSTER_ID:-}
      - CAMUNDA_CLUSTER_REGION=${CAMUNDA_CLUSTER_REGION:-}
      - CAMUNDA_CLOUD_BASE_URL=${CAMUNDA_CLOUD_BASE_URL:-}
      - CAMUNDA_CLIENT_ID=${CAMUNDA_CLIENT_ID:-}
      - CAMUNDA_CLIENT_SECRET=${CAMUNDA_CLIENT_SECRET:-}
      - CAMUNDA_OAUTH_URL=${CAMUNDA_OAUTH_URL:-}
      - ZEEBE_GRPC_ADDRESS=${ZEEBE_GRPC_ADDRESS:-http://zeebe:26500}

  # --- Elasticsearch (required by Zeebe for exporting process data) ---
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.16
    hostname: elasticsearch
    networks:
      - worldpulse
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - cluster.name=elasticsearch
      - bootstrap.memory_lock=true
      - cluster.routing.allocation.disk.threshold_enabled=false
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elastic:/usr/share/elasticsearch/data

  # --- Zeebe broker (Camunda 8 process engine) ---
  # Runs BPMN processes; services connect via gRPC on port 26500
  zeebe:
    image: camunda/zeebe:8.5.17
    hostname: zeebe
    networks:
      - worldpulse
    ports:
      - "26500:26500"
      - "9600:9600"
    environment:
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_CLASSNAME=io.camunda.zeebe.exporter.ElasticsearchExporter
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_URL=http://elasticsearch:9200
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_BULK_SIZE=1
      - ZEEBE_BROKER_DATA_DISKUSAGECOMMANDWATERMARK=0.998
      - ZEEBE_BROKER_DATA_DISKUSAGEREPLICATIONWATERMARK=0.999
    depends_on:
      - elasticsearch

  # --- Operate (Camunda 8 monitoring UI) ---
  # View deployed processes, running instances, incidents at http://localhost:8085
  operate:
    image: camunda/operate:8.5.17
    hostname: operate
    networks:
      - worldpulse
    ports:
      - "8085:8080"
    environment:
      - CAMUNDA_OPERATE_ZEEBE_GATEWAYADDRESS=zeebe:26500
      - CAMUNDA_OPERATE_ELASTICSEARCH_URL=http://elasticsearch:9200
      - CAMUNDA_OPERATE_ZEEBEELASTICSEARCH_URL=http://elasticsearch:9200
    depends_on:
      - elasticsearch
      - zeebe

  # --- Tasklist (Camunda 8 user task UI) ---
  # For human tasks in BPMN processes at http://localhost:8086
  tasklist:
    image: camunda/tasklist:8.5.17
    hostname: tasklist
    networks:
      - worldpulse
    ports:
      - "8086:8080"
    environment:
      - CAMUNDA_TASKLIST_ZEEBE_GATEWAYADDRESS=zeebe:26500
      - CAMUNDA_TASKLIST_ELASTICSEARCH_URL=http://elasticsearch:9200
      - CAMUNDA_TASKLIST_ZEEBEELASTICSEARCH_URL=http://elasticsearch:9200
    depends_on:
      - elasticsearch
      - zeebe

  # --- Connectors runtime (executes out-of-the-box connectors like Slack) ---
  connectors:
    image: camunda/connectors-bundle:8.5.11
    hostname: connectors
    networks:
      - worldpulse
    ports:
      - "8089:8080"
    environment:
      - ZEEBE_CLIENT_BROKER_GATEWAY-ADDRESS=zeebe:26500
      - ZEEBE_CLIENT_SECURITY_PLAINTEXT=true
      - CAMUNDA_CONNECTOR_POLLING_ENABLED=false
      - CAMUNDA_CONNECTOR_WEBHOOK_ENABLED=false
      # Supplied via .env (see .env.example); empty by default so no secret ships.
      - SLACK_OAUTH_TOKEN=${SLACK_OAUTH_TOKEN:-}
      - SLACK_CHANNEL=${SLACK_CHANNEL:-}
    depends_on:
      - zeebe

  # --- Market Scanner (Python — financial market monitoring) ---
  # Publishes MarketAlertEvent to Kafka when significant price movements are detected.
  # Modes: MOCKED (default, no API key needed) or REAL (Finnhub WebSocket).
  market-scanner:
    build: ./market-scanner
    container_name: market-scanner
    networks:
      - worldpulse
    ports:
      - "8081:8081"
    depends_on:
      - kafka1
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka1:29092,kafka2:29094,kafka3:29096
      - MARKET_MODE=${MARKET_MODE:-MOCKED}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - WATCHLIST=AAPL,MSFT,GOOGL,AMZN,TSLA
      - WINDOW_SIZE=300
      - DROP_THRESHOLD=3.0
      - SPIKE_THRESHOLD=5.0
      - VOLATILITY_THRESHOLD=8.0
      - EVAL_INTERVAL=30
      - COOLDOWN_SECONDS=300
      - MOCK_EVENT_INTERVAL_SECONDS=5
      - HEALTH_PORT=8081

  # --- BlueSky Scanner (Python — social media monitoring) ---
  # Publishes SocialTrendEvent to Kafka when keyword trends are detected on Bluesky.
  # Uses Jetstream stream + Search API backfill.
  bluesky-scanner:
    build: ./bluesky-scanner
    container_name: bluesky-scanner
    networks:
      - worldpulse
    depends_on:
      - kafka1
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka1:29092,kafka2:29094,kafka3:29096
      - BLUESKY_MODE=REAL
      - SCAN_STRATEGY=REALTIME
      - SEARCH_ENABLED=false
      - MOCK_EVENT_INTERVAL_SECONDS=1
      - KEYWORDS=AI regulation,climate summit,crypto crash,tech layoffs,swiss tech
      - MIN_KEYWORD_LENGTH=4
      - BLOCKED_SINGLE_KEYWORDS=the,and,is,ai
      - TRENDING_THRESHOLD=50
      - WINDOW_SIZE=300
      - EVAL_INTERVAL=30
      - COOLDOWN_SECONDS=900
      - SEARCH_INTERVAL=120
      - SEARCH_LIMIT=25
      - ENGLISH_ONLY=false
      - DEMO_MODE=false

  # --- Process service (Kafka → Zeebe bridge) ---
  # Listens for SignupRequestedEvent on Kafka, starts BPMN process instances in Zeebe
  process:
    build:
      context: ./process
      dockerfile: Dockerfile
    restart: on-failure
    networks:
      - worldpulse
    ports:
      - "8095:8095"
    depends_on:
      - kafka1
      - zeebe
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka1:29092,kafka2:29094,kafka3:29096
      - CAMUNDA_CLIENT_ZEEBE_ENABLED=true
      - ZEEBE_GRPC_ADDRESS=${ZEEBE_GRPC_ADDRESS:-http://zeebe:26500}
      - CAMUNDA_CLIENT_MODE=${CAMUNDA_CLIENT_MODE:-selfManaged}
      - CAMUNDA_CLUSTER_ID=${CAMUNDA_CLUSTER_ID:-}
      - CAMUNDA_CLUSTER_REGION=${CAMUNDA_CLUSTER_REGION:-}
      - CAMUNDA_CLOUD_BASE_URL=${CAMUNDA_CLOUD_BASE_URL:-}
      - CAMUNDA_CLIENT_ID=${CAMUNDA_CLIENT_ID:-}
      - CAMUNDA_CLIENT_SECRET=${CAMUNDA_CLIENT_SECRET:-}
      - CAMUNDA_OAUTH_URL=${CAMUNDA_OAUTH_URL:-}

  # --- Login Generator (Python — produces LoginEvents for stream-processing) ---
  # Feeds the C4 login-stats windowed aggregation in the stream-processing pipeline.
  # Only starts with: docker compose --profile demo up login-generator
  login-generator:
    build: ./login-generator
    container_name: login-generator
    profiles:
      - demo
    networks:
      - worldpulse
    depends_on:
      - kafka1
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka1:29092,kafka2:29094,kafka3:29096
      - LOGIN_COUNT=50
      - LOGIN_INTERVAL_MS=200
      - LOGIN_CONTINUOUS=true

  # --- Demo Injector (Python — replays scripted scenarios into 'worldpulse') ---
  # Lights up the whole stream-processing pipeline during demos by playing back
  # pre-built event sequences (iran-oil, ai-model, crypto-crash, mass-signup, etc.).
  # Run a scenario on demand, e.g.:
  #   docker compose --profile demo run --rm demo-injector \
  #     python demo_injector.py iran-oil --burst-size 5
  demo-injector:
    build: ./demo-injector
    container_name: demo-injector
    profiles:
      - demo
    networks:
      - worldpulse
    depends_on:
      - kafka1
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka1:29092,kafka2:29094,kafka3:29096

  # --- Demo Server (HTTP API for triggering demo scenarios from the dashboard) ---
  # Persistent service that exposes POST /scenarios/{name} so the dashboard's
  # Developer tab can fire scenarios without a terminal.
  # Starts with: docker compose --profile demo up -d demo-server
  demo-server:
    build: ./demo-injector
    container_name: demo-server
    command: ["python", "-u", "demo_server.py"]
    profiles:
      - demo
    networks:
      - worldpulse
    ports:
      - "8112:8112"
    depends_on:
      - kafka1
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka1:29092,kafka2:29094,kafka3:29096
      - QUERY_SERVICE_URL=http://stream-processing:8097
      - DEMO_SERVER_PORT=8112

  # --- Stream Processing (Kafka Streams — enrichment + analytics) ---
  # Reads raw events from Kafka topics, enriches them, and builds analytics views.
  stream-processing:
    build:
      context: ./stream-processing
      dockerfile: Dockerfile
    networks:
      - worldpulse
    ports:
      - "8097:8097"
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka1:29092,kafka2:29094,kafka3:29096
      - APPLICATION_SERVER=stream-processing:8097

# All containers share this network so they can reach each other by hostname
networks:
  worldpulse:
    driver: bridge

volumes:
  elastic:
    driver: local
